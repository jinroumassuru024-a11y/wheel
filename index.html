<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ホイール診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: アプリ風。上に固定のアプリバー、中央に1カラムのカード、下に固定のボタンバー。単一のライトテーマ */
:root{
  color-scheme:light;
  --bg:#f3f4f6; --surface:#ffffff; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --soft:#f9fafb;
  --primary:#111827; --onprimary:#ffffff; --accent:#2f4bd8;
  --no:#f3b4b0; --yes:#9fd3b4; --gauge:#16a34a; --gaugelow:#ef4444;
  --wheel:#2f4bd8; --wheelfill:rgba(47,75,216,.14);
  --shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px rgba(17,24,39,.06);
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#quiz{--pg:#16a34a}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,.cname{font-weight:700;text-wrap:balance;margin:0;line-height:1.35;letter-spacing:.01em}
h2{font-size:20px}
p{margin:0}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.appbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.brand svg{width:26px;height:26px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:999px}
.tabs button{font:inherit;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.hero{display:flex;flex-direction:column;gap:14px;align-items:center;padding-block:12px 4px}
.hero svg{width:170px;max-width:55%}
.hero .q1{font-size:22px;font-weight:700;text-align:center}
.marq{width:100%;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq .track{display:flex;gap:8px;width:max-content;animation:marq 40s linear infinite}
.marq span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 0;padding:0;list-style:none}
.steps li{display:flex}
.steps li::before{content:"";flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.steps li:nth-child(1){--c:#16a34a}.steps li:nth-child(2){--c:#e11d48}.steps li:nth-child(3){--c:#d97706}.steps li:nth-child(4){--c:#64748b}.steps li:nth-child(5){--c:#2f4bd8}
.steps li.done::before,.steps li.now::before{background:var(--c)}
.prog{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.prog .left:empty{display:none}
.prog .left{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface);padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.panel{background:var(--surface);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:22px;box-shadow:var(--shadow)}
.sub{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0;padding-bottom:0}
.q p{font-weight:700;font-size:16px}
.scale{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:0 2px}
.scale button{flex:0 0 auto;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;padding:0;transition:transform .15s,background .15s,border-color .15s}
.scale button:nth-child(1),.scale button:nth-child(5){width:46px;height:46px}
.scale button:nth-child(2),.scale button:nth-child(4){width:38px;height:38px}
.scale button:nth-child(3){width:30px;height:30px}
.scale button:nth-child(-n+2){border-color:var(--no)}.scale button:nth-child(n+4){border-color:var(--yes)}
.scale button:active{transform:scale(.9)}
.scale button[aria-pressed=true]{background:var(--pg);border-color:var(--pg);transform:scale(1.06)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.q.miss{outline:2px solid var(--gaugelow);outline-offset:8px;border-radius:10px}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice button{font:inherit;font-size:14px;font-weight:700;padding:10px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer}
.choice button[aria-pressed=true]{background:var(--pg);color:#fff;border-color:var(--pg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lab{font-weight:700;font-size:14px}
input[type=date],input[type=text],textarea{font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);color:var(--fg);max-width:100%;width:100%}
textarea{font-size:13px;min-height:90px;resize:vertical}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav .btn.main{flex:1}
.btn{font:inherit;font-weight:700;font-size:16px;padding:14px 22px;border-radius:14px;border:0;background:var(--primary);color:var(--onprimary);cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--bg);color:var(--fg)}
.btn.small{font-size:14px;padding:10px 16px;border-radius:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;align-self:center}
.cross{display:inline-grid;place-items:center;width:1.1em;height:1.1em;color:#16a34a;font-weight:900}
.card{border-radius:24px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.chead{position:relative;overflow:hidden;padding:14px 20px 22px;display:flex;flex-direction:column;gap:6px}
.chead .tag{font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.8}
.cname{font-size:clamp(24px,6.6vw,32px);position:relative;z-index:1}
.toy{position:relative;height:120px;margin-inline:-8px;touch-action:none}
.toy span{position:absolute;left:0;top:0;width:48px;height:48px;display:grid;place-items:center;font-size:26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.15);cursor:grab;user-select:none;-webkit-user-select:none;will-change:transform}
.cbody{padding:22px 20px;display:flex;flex-direction:column;gap:20px}
.aru{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.aru li{display:flex;gap:10px;font-weight:500}
.aru li::before{content:"";flex:0 0 6px;height:6px;margin-top:.75em;border-radius:50%;background:var(--muted)}
.strong{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.strong b{display:block;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:460px){.items{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.side h3,.lbl{margin:0;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.item{display:flex;gap:12px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
.item .ic{font-size:26px;line-height:1;width:32px;text-align:center}
.item .t{display:flex;flex-direction:column;line-height:1.4;min-width:0;flex:1;gap:5px}
.item .t small{color:var(--muted);font-size:12px}
.gauge{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--gauge)}
.gauge.low i{background:var(--gaugelow)}
.note{font-size:13px;color:var(--muted)}
.copybox{white-space:pre-wrap;word-break:break-all;font-size:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;font-family:var(--font)}
.send{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:10px}
summary{cursor:pointer}
.admin{border:1.5px dashed var(--line);box-shadow:none}
.wheel{width:100%;max-width:340px;align-self:center}
.wheel text{fill:var(--fg);font-size:12px;font-weight:700;font-family:var(--font)}
.wheel .grid{fill:none;stroke:var(--line)}
.wheel .poly{fill:var(--wheelfill);stroke:var(--wheel);stroke-width:2;stroke-linejoin:round}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.meta dt{color:var(--muted)}.meta dd{margin:0}
.rows{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.rows button{width:100%;text-align:left;font:inherit;display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--fg);cursor:pointer}
.rows .row{display:flex;gap:6px}
.rows .row>button:first-child{flex:1;min-width:0;flex-direction:column;align-items:flex-start;gap:2px}
.rows .row>button:first-child span{font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.rows .pbtn{display:flex;align-items:center;flex:0 0 auto;width:auto;font:inherit;font-size:13px;font-weight:700;padding:0 14px;border-radius:12px;border:0;background:var(--primary);color:var(--onprimary);cursor:pointer}
.pin{font-size:28px;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums}
.rows small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.err{color:var(--gaugelow);font-size:14px}
@media (prefers-reduced-motion:no-preference){.panel,.card{animation:pop .35s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{opacity:.6;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.marq{overflow-x:auto}.marq .track{animation:none}}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>

<div class="wrap">
  <header class="appbar"><div class="in">
    <h1 class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><polygon points="16,3 25,8 29,17 24,26 15,29 6,25 3,15 8,6" fill="none" stroke="#e5e7eb" stroke-width="2"/><polygon points="16,7 23,11 25,17 20,23 15,25 9,21 8,15 11,9" fill="rgba(47,75,216,.18)" stroke="#2f4bd8" stroke-width="2" stroke-linejoin="round"/></svg>ホイール診断</h1>
    <div class="tabs" id="tabs">
      <button type="button" id="tab-quiz" aria-pressed="true">診断</button>
      <button type="button" id="tab-admin" aria-pressed="false">管理</button>
    </div>
  </div></header>

  <div id="quiz" style="display:flex;flex-direction:column;gap:22px">
    <section class="hero" id="hero"></section>
    <ol class="steps" id="steps" aria-label="進み具合"></ol>
    <div class="prog"><h2 id="stitle"></h2><span class="left" id="left"></span></div>
    <section class="panel" id="page"></section>
    <div class="nav" id="nav"></div>
  </div>

  <div id="admin" hidden style="display:flex;flex-direction:column;gap:22px"></div>
</div>

<script>

 body:["背筋がピンと伸びて、胸を張っている","猫背で、肩がだらんと下がっている"],
 mind:["目がキラキラ輝いている","目がうつろで、ぼーっと遠くを見ている"],

 partner:["胸元にハートが満タンで光っている","空っぽのハートのフチだけが胸元に浮いている"],
 friend:["まわりに握手のマークが明るく光っている","ほどけかけた握手のマークが寂しそうに浮いている"],
 work:["背中に旗が高くはためいている","しおれた旗を引きずっている"],
 money:["パンパンにふくらんだ金貨袋を持っている","ぺたんこの金貨袋を逆さにしている"],

};
function promptOf(stem,scores,sx){
  const c=CHARS[stem],l=LOOK[stem],res=judge(scores);
  const L=["次のキャラクターのイラストを1枚作ってください。","","キャラクター",c.name,l.look,"性格 "+c.aru.slice(0,2).join("。")];
  if(sx==="m"||sx==="f")L.push(`性別 ${SEX[sx]}のキャラクターとして描く`);
  L.push("");
  if(res.flat){L.push("状態","全体的にバランスがよく、自然体");}
  else{
    L.push("今の状態(絵の中で表現してください)");
    res.good.forEach(a=>L.push(`${PROMPT_ITEM[a.it.k][0]}(${a.it.label}が満たされている)`));
    res.bad.forEach(a=>L.push(`${PROMPT_ITEM[a.it.k][1]}(${a.it.label}が足りていない)`));
  }
  L.push("","雰囲気","ポップでゆるかわいい、ちょっと笑える感じ",`背景は${l.bg}を基調にしたシンプルなもの`,"文字は入れない","実在のアニメやゲームのキャラクターには似せない");
  return L.join("\n");
}
var WHEEL_ORDER=["family","partner","friend","growth","money","work","body","mind","social"];
var WHEEL_COL={"人間関係":["#e0a28c","#fbf1ed"],"経済":["#b3ade6","#f4f3fc"],"健康":["#95c4b0","#eef6f2"]};
function to10(v){return v==null?null:Math.round((v-1)*9/4+1);}
const PAGES=["健康","人間関係","経済","生年月日","結果"];
const SCALE=["思わない","あまり","どちらとも","やや","そう思う"];
const PLABEL={yes:"いる",trying:"いない(作ろうとしている)",none:"いない(今は必要ない)"};
const ans={};let partnerHas=null;let page=0;let bd="";let nick="";let sex="";
const SEX={m:"男性",f:"女性",x:"答えない"};
let isOwner=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function stemOf(iso){
  const [y,m,d]=iso.split("-").map(Number);
  const days=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,1))/864e5); // 1900-01-01 = 甲戌
  return "甲乙丙丁戊己庚辛壬癸"[((days%10)+10)%10];
}
function keysOf(g){
  const ks=[];
  ITEMS.filter(it=>it.g===g).forEach(it=>{
    if(it.branch){ks.push("pb");if(partnerHas!=="yes")return;}
    it.qs.forEach((_,i)=>ks.push(it.k+"-"+i));
  });
  return ks;
}
const done=k=>k==="pb"?!!partnerHas:!!ans[k];
const totalLeft=()=>PAGES.slice(0,3).reduce((n,g)=>n+keysOf(g).filter(k=>!done(k)).length,0);
const scaleHTML=key=>`<div class="scale" role="group">${SCALE.map((s,i)=>`<button type="button" data-key="${key}" data-v="${i+1}" aria-pressed="${ans[key]===i+1}" aria-label="${s}" title="${s}" id="b-${key}-${i+1}"></button>`).join("")}</div><div class="ends"><span>思わない</span><span>そう思う</span></div>`;

// 回答 → 項目ごとの平均(パートナー: 作ろうとしている=1、必要ない=null)
function scoresFromAnswers(){
  const s={};
  ITEMS.forEach(it=>{
    if(it.branch&&partnerHas==="none"){s[it.k]=null;return;}
    if(it.branch&&partnerHas==="trying"){s[it.k]=1;return;}
    const vs=it.qs.map((_,i)=>ans[it.k+"-"+i]);
    s[it.k]=Math.round(vs.reduce((a,b)=>a+b,0)/vs.length*1000)/1000;
  });
  return s;
}
function judge(scores){
  const avgs=ITEMS.filter(it=>scores[it.k]!=null).map(it=>({it,v:scores[it.k]}));
  const max=Math.max(...avgs.map(a=>a.v)),min=Math.min(...avgs.map(a=>a.v));
  if(max===min)return{good:[],bad:[],flat:true};
  return{good:avgs.filter(a=>a.v===max).slice(0,2),bad:avgs.filter(a=>a.v===min).slice(0,2),flat:false};
}
function resultCard(stem,scores){
  const c=CHARS[stem],res=judge(scores);
  const pct=v=>Math.max(8,Math.round((v-1)/4*100));
  const itemHTML=(a,good)=>`<div class="item"><span class="ic" aria-hidden="true">${good?a.it.ic:(a.it.badic||a.it.ic)}</span>
    <span class="t"><b>${good?a.it.good:a.it.bad}</b><span class="gauge${good?"":" low"}"><i style="width:${pct(a.v)}%"></i></span><small>${a.it.g} / ${a.it.label}</small></span></div>`;
  const items=res.flat?`<p class="note">全部同じ点数だったので、アイテムはなし。逆にレア。</p>`
    :`<div class="items"><div class="side"><h3>今満たされているもの</h3>${res.good.map(a=>itemHTML(a,true)).join("")}</div>
      <div class="side"><h3>今足りていないもの</h3>${res.bad.map(a=>itemHTML(a,false)).join("")}</div></div>`;
  const L=[c.name,"",...c.aru,"",`強み ${c.strong}`,""];
  if(res.flat)L.push("アイテム なし","全部同じ点数。逆にレア");
  else L.push("今満たされているもの",...res.good.map(a=>`${a.it.label} ${a.it.good}`),"","今足りていないもの",...res.bad.map(a=>`${a.it.label} ${a.it.bad}`));
  const html=`<div class="card">
    <div class="chead" style="background:${c.color};color:${c.text};${stem==="辛"?"border-bottom:1px solid var(--line)":""}">
      <span class="tag">あなたのキャラ</span><p class="cname">${c.name}</p></div>
    <div class="cbody">
      <ul class="aru">${c.aru.map(a=>`<li>${a}</li>`).join("")}</ul>
      <div class="strong"><b>強み</b>${c.strong}</div>
      ${items}
    </div></div>`;
  return{html,text:L.join("\n")};
}

// 送信コード(回答者 → 管理者)。人が読んでもホイールにならない形
function encodeCode(rec){return "WHEEL1:"+btoa(unescape(encodeURIComponent(JSON.stringify(rec))));}
function decodeCode(str){
  const m=String(str).match(/(?:WHEEL1|JKN1):([A-Za-z0-9+/=]+)/);
  if(!m)throw new Error("コードが見つかりません。「WHEEL1:」から始まる文字をそのまま貼り付けてください。");
  let rec;try{rec=JSON.parse(decodeURIComponent(escape(atob(m[1]))));}catch(_){throw new Error("コードが途中で切れているようです。全部コピーされているか確認してください。");}
  if(!rec||!/^\d{4}-\d{2}-\d{2}$/.test(rec.b)||!rec.s||typeof rec.s!=="object")throw new Error("コードの中身が足りません。もう一度送ってもらってください。");
  const s={};ITEMS.forEach(it=>{const v=rec.s[it.k];s[it.k]=v==null?null:Math.min(5,Math.max(1,Number(v)||1));});
  return{n:String(rec.n||"").slice(0,20),b:rec.b,p:PLABEL[rec.p]?rec.p:null,x:SEX[rec.x]?rec.x:null,s,t:typeof rec.t==="string"?rec.t:null};
}
async function copyText(btn,text,box){
  try{await navigator.clipboard.writeText(text);btn.textContent="コピーしました";}
  catch(_){const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="選択したのでコピーしてください";}
}


/* 結果カードのアイテムを指ではじいて遊べる(壁に当たると振動、対応端末のみ) */
function startToy(host,icons){
  if(!host||!icons.length)return;
  const W=()=>host.clientWidth,H=()=>host.clientHeight,S=48;
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const bs=icons.map((ic,i)=>{const el=document.createElement("span");el.innerHTML=ic;host.append(el);
    return{el,x:W()-S-12-i*(S+8),y:12+(i%2)*20,vx:(Math.random()-.5)*4,vy:0,drag:false,px:0,py:0};});
  const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}};
  const place=b=>b.el.style.transform=`translate(${b.x}px,${b.y}px)`;
  bs.forEach(b=>{place(b);
    b.el.addEventListener("pointerdown",e=>{b.drag=true;b.el.setPointerCapture(e.pointerId);b.px=e.clientX;b.py=e.clientY;b.vx=b.vy=0;b.el.style.cursor="grabbing";});
    b.el.addEventListener("pointermove",e=>{if(!b.drag)return;const dx=e.clientX-b.px,dy=e.clientY-b.py;b.x+=dx;b.y+=dy;b.vx=dx;b.vy=dy;b.px=e.clientX;b.py=e.clientY;place(b);});
    const up=()=>{b.drag=false;b.el.style.cursor="grab";};b.el.addEventListener("pointerup",up);b.el.addEventListener("pointercancel",up);});
  if(still)return;
  const step=()=>{
    if(!host.isConnected)return;
    if(!document.hidden){
      bs.forEach(b=>{if(b.drag)return;b.vy+=.35;b.vx*=.995;b.x+=b.vx;b.y+=b.vy;let hit=0;
        if(b.x<0){b.x=0;hit=Math.abs(b.vx);b.vx=-b.vx*.7}
        if(b.x>W()-S){b.x=W()-S;hit=Math.abs(b.vx);b.vx=-b.vx*.7}
        if(b.y<0){b.y=0;hit=Math.abs(b.vy);b.vy=-b.vy*.7}
        if(b.y>H()-S){b.y=H()-S;hit=Math.max(hit,Math.abs(b.vy));b.vy=-b.vy*.6;b.vx*=.96}
        if(hit>4)buzz();place(b);});
      for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){const a=bs[i],c=bs[j],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy)||1;
        if(d<S){const nx=dx/d,ny=dy/d,o=(S-d)/2;a.x-=nx*o;a.y-=ny*o;c.x+=nx*o;c.y+=ny*o;
          const rv=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;if(rv<0){a.vx+=rv*nx;a.vy+=rv*ny;c.vx-=rv*nx;c.vy-=rv*ny;if(-rv>4)buzz();}}}
    }
    requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

// 鶏頭図(ポーラーエリア)型のホイール。上から時計回りに 人間関係 → 経済 → 健康
// レーダー型のホイール。上から時計回りに 家族 → パートナー → 友人 → 成長 → お金 → 仕事 → 肉体 → 精神 → 社会
// mode: "deco"=飾り(文字なし) / "user"=項目名だけ / "admin"=項目名と点数
function wheelSVG(scores,mode){
  const n=WHEEL_ORDER.length,cx=180,cy=170,R=118;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*v/5;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let g="";
  for(let lv=1;lv<=5;lv++)g+=`<polygon class="grid" points="${WHEEL_ORDER.map((_,i)=>pt(i,lv).join(",")).join(" ")}"/>`;
  WHEEL_ORDER.forEach((_,i)=>{const[x,y]=pt(i,5);g+=`<line class="grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;});
  const poly=WHEEL_ORDER.map((k,i)=>pt(i,scores[k]==null?0:scores[k]).join(",")).join(" ");
  if(mode==="deco")return `<svg class="wheel" viewBox="56 46 248 248" aria-hidden="true">${g}<polygon class="poly" points="${poly}"/></svg>`;
  const labels=WHEEL_ORDER.map((k,i)=>{const it=ITEMS.find(x=>x.k===k),[x,y]=pt(i,6.1),v=scores[k];
    const t=mode==="admin"?`${it.label} ${v==null?"なし":to10(v)}`:it.label;
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${t}</text>`;}).join("");
  return `<svg class="wheel" viewBox="0 0 360 340" role="img" aria-label="9項目のホイール">${g}<polygon class="poly" points="${poly}"/>${labels}</svg>`;
}

      const row=rows.find(r=>r.id===rec.__id);if(row)row.gifted=rec.gifted;renderRows();
      gb.textContent=rec.gifted?"プレゼント済み(戻す)":"プレゼント済みにする";}
    catch(_){rec.gifted=!rec.gifted;gb.textContent="保存できませんでした。もう一度押してください";}
    gb.disabled=false;};
}
function openRecord(rec){
  const pv=document.getElementById("preview");pv.innerHTML=recordView(rec);bindRecord(rec);
  pv.scrollIntoView({behavior:"smooth"});
}

/* ---------- 送信と読み込み(Googleスプレッドシート) ---------- */
const API="https://script.google.com/macros/s/AKfycbznStzH8s6DdP3S5HTAYUJl9cIh_GlIgZRz8W_WEXCkI0aNHO-EHe3D2N_b_R0Zs_51qg/exec";
let sent=false,isSample=false,adminKey="",rows=[];
function post(obj){return fetch(API,{method:"POST",mode:"no-cors",body:JSON.stringify(obj)});}
async function sendOnce(rec){
  const msg=document.getElementById("sendmsg");
  if(isSample){msg.textContent="サンプルなので送信していません。";return;}
  if(sent){msg.textContent="結果はすすめてくれた人に届いています。";return;}
  sent=true;
  try{await post(rec);msg.textContent="結果はすすめてくれた人に届きました。";}
  catch(_){sent=false;msg.innerHTML='送信できませんでした。電波のいいところで <button class="link" type="button" id="resend">もう一度送る</button>';
    document.getElementById("resend").onclick=()=>sendOnce(rec);}
}
async function loadRows(){
  const res=await fetch(API+"?key="+encodeURIComponent(adminKey));
  const j=await res.json();
  if(j.error)throw new Error(j.error);
  rows=j.rows||[];
}
function renderRows(){
  const rl=document.getElementById("rows");if(!rl)return;
  rl.innerHTML=rows.length?"":`<li class="note">まだ回答はありません。</li>`;
  rows.forEach(r=>{const li=document.createElement("li");li.className="row";
    const b=document.createElement("button");b.type="button";
    const s1=document.createElement("span");s1.textContent=`${r.n||"(なし)"}  ${CHARS[stemOf(r.b)].name}`;
    const s2=document.createElement("small");s2.textContent=(r.gifted?"🎁 プレゼント済み  ":"未プレゼント  ")+new Date(r.t).toLocaleDateString("ja-JP");
    b.append(s1,s2);b.onclick=()=>openRecord(Object.assign({},r,{__id:r.id}));
    const pb=document.createElement("button");pb.type="button";pb.className="pbtn";pb.textContent="プロンプト";
    pb.onclick=async()=>{const t=promptOf(stemOf(r.b),r.s,r.x);
      try{await navigator.clipboard.writeText(t);pb.textContent="コピー済み";}catch(_){openRecord(Object.assign({},r,{__id:r.id}));}
      setTimeout(()=>pb.textContent="プロンプト",2000);};
    li.append(b,pb);rl.append(li);});
}
function renderAdmin(){
  const el=document.getElementById("admin");
  if(!adminKey){
    el.innerHTML=`<section class="panel admin"><h2>管理画面</h2>
      <div class="field"><label for="akey">パスワード(8桁の数字)</label>
      <input type="password" id="akey" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" class="pin"></div>
      <p class="err" id="aerr"></p></section>`;
    const inp=document.getElementById("akey");inp.focus();
    inp.oninput=async()=>{inp.value=inp.value.replace(/\D/g,"").slice(0,8);document.getElementById("aerr").textContent="";
      if(inp.value.length<8)return;
      adminKey=inp.value;inp.disabled=true;
      try{await loadRows();try{localStorage.setItem("wheelKey",adminKey)}catch(_){}unlock();renderAdmin();}
      catch(_){adminKey="";inp.disabled=false;inp.value="";inp.focus();document.getElementById("aerr").textContent="パスワードが違います。";}};
    return;
  }
  el.innerHTML=`<div id="preview" style="display:flex;flex-direction:column;gap:18px"></div>
    <section class="panel admin">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>届いた回答</h2>
        <div style="display:flex;gap:8px"><button class="btn ghost small" id="reload" type="button">更新</button><button class="btn ghost small" id="lock" type="button">ロック</button></div></div>
      <ul class="rows" id="rows"></ul>
    </section>`;
  renderRows();
  document.getElementById("lock").onclick=()=>{adminKey="";isOwner=false;rows=[];try{localStorage.removeItem("wheelKey")}catch(_){}setTab(false);render();};
  document.getElementById("reload").onclick=async e=>{e.target.disabled=true;try{await loadRows();renderRows();}catch(_){}e.target.disabled=false;};
}
function setTab(admin){
  document.getElementById("tab-quiz").setAttribute("aria-pressed",String(!admin));
  document.getElementById("tab-admin").setAttribute("aria-pressed",String(admin));
  document.getElementById("quiz").hidden=admin;document.getElementById("admin").hidden=!admin;
  if(admin)renderAdmin();
}
function unlock(){isOwner=true;}
document.getElementById("tab-quiz").onclick=()=>{setTab(false);render();};
document.getElementById("tab-admin").onclick=()=>setTab(true);
try{adminKey=localStorage.getItem("wheelKey")||""}catch(_){}
if(adminKey)loadRows().then(()=>{unlock();render();renderRows();}).catch(()=>{adminKey="";});
</script>
